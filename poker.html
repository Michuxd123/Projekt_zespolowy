<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Texas Hold'em</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/poker.css">
</head>
<body>
    <div class="poker-container">
        <div id="setup-screen">
            <h1>Texas Hold'em</h1>
            <input type="number" id="initial-stack" placeholder="Kwota wejścia (np. 1000)" value="1000">
            <button id="start-game-btn">Rozpocznij Grę</button>
        </div>

        <div id="game-table" style="display: none;">
            <div class="info-panel">
                <div>Pula: <span id="pot">0</span>$</div>
                <div>Stawka min: <span id="min-bet">0</span>$</div>
            </div>

            <div class="opponent-area">
                <div class="player-info">Komputer: <span id="cpu-money">0</span>$</div>
                <div class="cards-container" id="cpu-cards"></div>
                <div id="cpu-status"></div>
            </div>

            <div class="community-area">
                <div class="cards-container" id="community-cards"></div>
            </div>

            <div class="player-area">
                <div id="player-status"></div>
                <div class="cards-container" id="player-cards"></div>
                <div class="player-info">Ty: <span id="player-money">0</span>$</div>
            </div>

            <div class="controls">
                <button id="btn-fold">Fold</button>
                <button id="btn-check">Check/Call</button>
                <button id="btn-raise">Raise</button>
                <input type="number" id="raise-amount" placeholder="Kwota">
            </div>
            
            <div id="message-box"></div>
            <button id="next-hand-btn" style="display: none;">Następne rozdanie</button>
        </div>
    </div>
    <script src="js/games/poker.js"></script>
</body>
</html>
